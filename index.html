<!DOCTYPE html>
<html lang="en"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<title>Road Fighter</title>
<style>
html,body{margin:0;height:100%;background:#0b0b14;overflow:hidden;touch-action:none;user-select:none;-webkit-user-select:none;-webkit-touch-callout:none;font-family:"Courier New",monospace}
canvas{display:block;position:fixed;inset:0;width:100%;height:100%}
#ui{position:fixed;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;background:rgba(5,5,20,.8);color:#fff;text-align:center;padding:16px;z-index:5}
#ui h1{font-size:clamp(28px,7vw,56px);margin:0 0 10px;color:#ffd21f;text-shadow:3px 3px 0 #d02020;letter-spacing:3px}
#ui p{margin:5px 0;font-size:clamp(13px,2.6vw,18px);line-height:1.5}
#ui b{color:#7cf}
#go{margin-top:18px;padding:14px 30px;font:bold clamp(15px,3.4vw,22px) "Courier New",monospace;background:#ffd21f;color:#222;border:0;border-bottom:5px solid #b08800;border-radius:6px;cursor:pointer}
#go:active{transform:translateY(3px);border-bottom-width:2px}
#pad{position:fixed;left:0;right:0;bottom:0;display:none;justify-content:space-between;align-items:flex-end;padding:0 14px calc(14px + env(safe-area-inset-bottom));z-index:4;pointer-events:none}
.grp{display:flex;gap:12px}
.b{pointer-events:auto;width:clamp(64px,18vmin,96px);height:clamp(64px,18vmin,96px);border-radius:50%;border:3px solid rgba(255,255,255,.65);background:rgba(255,255,255,.16);color:#fff;font:bold 26px sans-serif;display:flex;align-items:center;justify-content:center;touch-action:none}
.b.on{background:rgba(255,210,31,.55)}
#nit{background:rgba(255,80,20,.3);border-color:#ff9a4d;font-size:14px}
</style></head><body>
<canvas id="c"></canvas>
<div id="pad"><div class="grp"><div class="b" id="bl">&#9664;</div><div class="b" id="br">&#9654;</div></div><div class="b" id="nit">NITRO</div></div>
<div id="ui"><h1 id="t">ROAD FIGHTER</h1><div id="m"></div><button id="go">TAP TO PLAY / PRESS SPACE</button></div>
<script>
(()=>{
'use strict';
const $=id=>document.getElementById(id),cv=$('c'),cx=cv.getContext('2d');
const GW=360,RL=40,RW=280,LW=70,TRACK=3500,CW=26,CH=44;
let W,H,S,GH,OX,DPR=1;
function resize(){DPR=Math.min(devicePixelRatio||1,3);W=innerWidth;H=innerHeight;cv.width=W*DPR;cv.height=H*DPR;S=Math.min(W/GW,H/520);GH=H/S;OX=(W/S-GW)/2}
addEventListener('resize',resize);resize();
const carY=()=>GH-130;
const R=(x,y,w,h,c)=>{cx.fillStyle=c;cx.fillRect(x,y,w,h)};
const T=(s,x,y,c='#fff',a='left',z=13)=>{cx.font='bold '+z+'px "Courier New",monospace';cx.textAlign=a;cx.fillStyle='#000';cx.fillText(s,x+1,y+1);cx.fillStyle=c;cx.fillText(s,x,y)};
const hs=n=>{n=Math.imul(n|0,2654435761)>>>0;n^=n>>>15;n=Math.imul(n,2246822519)>>>0;return((n^(n>>>13))>>>0)%1000/1000};
const PAL={p:{b:'#f4f4f4',d:'#ff6a00'},blue:{b:'#2f6bff',d:'#1b3f9c'},yellow:{b:'#ffd21f',d:'#b88f00'},red:{b:'#e02424',d:'#8f1010'},fuel:{b:'#2bb04a',d:'#17702d'}};

/* ---------- input ---------- */
const K={l:0,r:0,n:0};
const KM={ArrowLeft:'l',a:'l',A:'l',ArrowRight:'r',d:'r',D:'r',' ':'n'};
addEventListener('keydown',e=>{const k=KM[e.key];if(k){e.preventDefault();K[k]=1}if((e.key===' '||e.key==='Enter')&&!e.repeat)start()});
addEventListener('keyup',e=>{const k=KM[e.key];if(k)K[k]=0});
addEventListener('blur',()=>{K.l=K.r=K.n=0});
function bind(id,k){const el=$(id);
 const on=e=>{e.preventDefault();K[k]=1;el.classList.add('on')},off=e=>{e.preventDefault();K[k]=0;el.classList.remove('on')};
 el.addEventListener('pointerdown',on);['pointerup','pointercancel','lostpointercapture'].forEach(n=>el.addEventListener(n,off));
 el.addEventListener('contextmenu',e=>e.preventDefault())}
bind('bl','l');bind('br','r');bind('nit','n');
const pad=$('pad'),showPad=()=>pad.style.display='flex';
if(matchMedia('(pointer:coarse)').matches||'ontouchstart' in window)showPad();
addEventListener('touchstart',showPad,{once:true,passive:true});
addEventListener('contextmenu',e=>e.preventDefault());

/* ---------- audio ---------- */
let AC,eng,engG,nb;
function initAudio(){if(AC)return;try{
 AC=new(window.AudioContext||window.webkitAudioContext)();
 eng=AC.createOscillator();eng.type='sawtooth';const f=AC.createBiquadFilter();f.type='lowpass';f.frequency.value=450;
 engG=AC.createGain();engG.gain.value=0;eng.connect(f);f.connect(engG);engG.connect(AC.destination);eng.start();
 nb=AC.createBuffer(1,AC.sampleRate,AC.sampleRate);const d=nb.getChannelData(0);for(let i=0;i<d.length;i++)d[i]=Math.random()*2-1;
}catch(e){AC=null}}
function tone(f1,f2,d,type='square',v=.1,dl=0){if(!AC)return;const t=AC.currentTime+dl,o=AC.createOscillator(),g=AC.createGain();
 o.type=type;o.frequency.setValueAtTime(f1,t);o.frequency.exponentialRampToValueAtTime(f2,t+d);
 g.gain.setValueAtTime(v,t);g.gain.exponentialRampToValueAtTime(.001,t+d);o.connect(g);g.connect(AC.destination);o.start(t);o.stop(t+d+.02)}
function noise(d,v){if(!AC)return;const s=AC.createBufferSource(),g=AC.createGain(),f=AC.createBiquadFilter(),t=AC.currentTime;
 s.buffer=nb;f.type='lowpass';f.frequency.value=1000;g.gain.setValueAtTime(v,t);g.gain.exponentialRampToValueAtTime(.001,t+d);
 s.connect(f);f.connect(g);g.connect(AC.destination);s.start();s.stop(t+d)}

/* ---------- state ---------- */
let state='start',ready=true,P,cars,parts,pops,off,dist,bonus,fuel,speed,spawnD,fuelD,shake,lowT=0,lastDir=0,wasNit=0,tm=0,HS=0;
try{HS=+localStorage.getItem('rf_hi')||0}catch(e){}
const score=()=>Math.floor(dist*10)+bonus;
function reset(){P={x:GW/2,spin:0,inv:0,slip:0,sd:1,ang:0,nit:0};cars=[];parts=[];pops=[];off=0;dist=0;bonus=0;fuel=100;speed=0;spawnD=300;fuelD=2500;shake=0}
reset();
function showStart(){$('t').textContent='ROAD FIGHTER';$('t').style.color='';
 $('m').innerHTML='<p>Reach the finish line before the fuel runs out!</p><p><b>&#9664; &#9654; / A D</b> steer &nbsp; <b>SPACE</b> nitro</p><p>Touch: on-screen <b>&#9664; &#9654; NITRO</b> buttons</p><p>Drive into <b>green fuel trucks</b> to refuel.<br>Avoid <b>cars, oil slicks and barriers</b>.</p><p>HIGH SCORE: <b>'+HS+'</b></p>';
 $('go').textContent='TAP TO PLAY / PRESS SPACE'}
showStart();
function start(){if(state==='play'||!ready)return;initAudio();if(AC&&AC.state==='suspended')AC.resume();
 reset();state='play';$('ui').style.display='none';tone(400,900,.2,'square',.07)}
$('ui').addEventListener('pointerup',e=>{e.preventDefault();start()});

function end(win){state='over';ready=false;
 if(win){bonus+=2000+Math.floor(fuel)*20;tone(523,1046,.2,'square',.1);tone(659,1318,.2,'square',.1,.2);tone(784,1568,.5,'square',.1,.4)}
 else tone(300,50,.9,'sawtooth',.12);
 const sc=score(),nh=sc>HS;if(nh){HS=sc;try{localStorage.setItem('rf_hi',HS)}catch(e){}}
 setTimeout(()=>{$('t').textContent=win?'YOU WIN!':'GAME OVER';$('t').style.color=win?'#7cff8a':'#ff5a4d';
  $('m').innerHTML='<p>'+(win?'FINISH LINE REACHED!':'OUT OF FUEL!')+'</p><p>SCORE: <b>'+sc+'</b></p><p>DISTANCE: <b>'+Math.floor(dist)+' m</b> / '+TRACK+' m</p><p>HIGH SCORE: <b>'+HS+'</b>'+(nh?' &nbsp;NEW!':'')+'</p>';
  $('go').textContent='PLAY AGAIN';$('ui').style.display='flex';ready=true},win?500:900)}

/* ---------- game logic ---------- */
function explode(x,y,n){for(let i=0;i<n;i++){const a=Math.random()*6.28,v=40+Math.random()*190;
 parts.push({x,y,vx:Math.cos(a)*v,vy:Math.sin(a)*v,l:.5+Math.random()*.6,c:['#ff2a00','#ff9a00','#ffe14d','#fff','#555'][i%5],s:3+Math.random()*5})}}
function crash(x,y){P.spin=1.1;P.inv=2.4;P.sd=Math.random()<.5?-1:1;speed*=.3;fuel=Math.max(0,fuel-10);explode(x,y,34);shake=1;noise(.6,.5);tone(220,35,.5,'sawtooth',.14)}
function add(t,l){const x=RL+LW/2+l*LW;if(cars.some(o=>Math.abs(o.x-x)<30&&o.y<90))return;
 cars.push({t,x,y:-70,sp:{blue:150,yellow:200,red:300,fuel:130,oil:0}[t],tx:0,lt:1+Math.random()*2,w:t==='oil'?44:CW,h:t==='oil'?30:t==='fuel'?50:CH})}
function spawn(){const prog=dist/TRACK,n=Math.random()<.25+prog*.2?2:1;
 [0,1,2,3].sort(()=>Math.random()-.5).slice(0,n).forEach(l=>{const r=Math.random();add(r<.15?'oil':r<.45?'blue':r<.75?'yellow':'red',l)})}
function update(dt){
 const prog=dist/TRACK,dry=fuel<=0,spin=P.spin>0,nit=!!K.n&&!dry&&!spin;P.nit=nit;
 if(nit&&!wasNit)tone(180,600,.35,'sawtooth',.07);wasNit=nit;
 const tgt=dry?0:spin?70:nit?560:360;
 speed+=(tgt-speed)*Math.min(1,dt*(spin?3:dry?.8:1.1));
 off+=speed*dt;dist+=speed*dt/10;
 fuel=Math.max(0,fuel-dt*(1.4+(nit?5:0)));
 if(fuel<25&&!dry){lowT-=dt;if(lowT<=0){tone(880,880,.08,'square',.05);lowT=.7}}
 const dir=K.r-K.l;
 if(spin){P.spin-=dt;P.ang+=dt*11;P.x+=P.sd*45*dt;if(P.spin<=0)P.ang=0}
 else{let v=230*(.4+.6*Math.min(1,speed/300));
  if(P.slip>0){P.slip-=dt;P.x+=P.sd*150*dt;v*=.35}
  P.x+=dir*v*dt;if(dir&&dir!==lastDir)tone(320,520,.05,'square',.04)}
 lastDir=dir;if(P.inv>0)P.inv-=dt;
 const lo=RL+10+CW/2,hi=RL+RW-10-CW/2;
 if(P.x<lo||P.x>hi){const h=P.x<lo?-1:1;P.x=h<0?lo+2:hi-2;if(!spin&&P.inv<=0){crash(P.x+h*CW/2,carY());P.sd=-h}}
 const cy=carY(),sp0=P.spin>0;
 for(const c of cars){
  c.y+=(speed-c.sp)*dt;
  if(c.t==='yellow'){c.lt-=dt;
   if(c.lt<=0&&c.y>-40&&c.y<cy-60){c.lt=1.5+Math.random()*2;const l=Math.round((c.x-RL-LW/2)/LW),nl=l+(Math.random()<.5?-1:1),nx=RL+LW/2+nl*LW;
    if(nl>=0&&nl<4&&!cars.some(o=>o!==c&&Math.abs(o.x-nx)<20&&Math.abs(o.y-c.y)<90))c.tx=nx}
   if(c.tx){const d=c.tx-c.x,m=90*dt;if(Math.abs(d)<=m){c.x=c.tx;c.tx=0}else c.x+=Math.sign(d)*m}}
  if(c.t!=='oil')for(const o of cars)if(o!==c&&o.t!=='oil'&&Math.abs(o.x-c.x)<30&&o.y<c.y&&c.y-o.y<62&&c.sp>o.sp)c.sp=o.sp;
  const dx=Math.abs(c.x-P.x),dy=Math.abs(c.y-cy);
  if(c.t==='fuel'){if(dx<(c.w+CW)/2-2&&dy<(c.h+CH)/2-2){c.dead=1;fuel=Math.min(100,fuel+30);bonus+=100;
    pops.push({s:'FUEL +30',x:P.x,y:cy-40,l:1});tone(660,660,.07,'square',.08);tone(880,880,.07,'square',.08,.07);tone(1320,1320,.12,'square',.08,.14)}}
  else if(c.t==='oil'){if(dx<c.w/2+4&&dy<c.h/2+8&&P.slip<=0&&!sp0&&P.inv<=0){P.slip=1;P.sd=Math.random()<.5?-1:1;tone(900,150,.45,'sine',.1)}}
  else if(!sp0&&P.inv<=0&&dx<(c.w+CW)/2-4&&dy<(c.h+CH)/2-4){crash((c.x+P.x)/2,(c.y+cy)/2);explode(c.x,c.y,20);c.dead=1}
  if(!c.cnt&&c.y>cy+CH){c.cnt=1;if(c.t!=='oil')bonus+=20}
 }
 cars=cars.filter(c=>!c.dead&&c.y<GH+120&&c.y>-300);
 spawnD-=speed*dt;if(spawnD<=0){spawn();spawnD=(220+Math.random()*170)*(1-prog*.35)}
 fuelD-=speed*dt;if(fuelD<=0){add('fuel',Math.floor(Math.random()*4));fuelD=2800+Math.random()*1800}
 if(dist>=TRACK)end(true);else if(dry&&speed<25)end(false);
}
function tick(dt){
 for(const p of parts){p.x+=p.vx*dt;p.y+=(p.vy+speed)*dt;p.l-=dt}parts=parts.filter(p=>p.l>0);
 for(const p of pops){p.y-=30*dt;p.l-=dt}pops=pops.filter(p=>p.l>0);
 if(shake>0)shake=Math.max(0,shake-dt*2);
}

/* ---------- drawing ---------- */
function car(x,y,c,o={}){cx.save();cx.translate(Math.round(x),Math.round(y));if(o.a)cx.rotate(o.a);
 const w=CW,h=o.h||CH,hw=w/2,hh=h/2;
 if(o.f){R(-5,hh,10,8+Math.random()*10,'#ff7a00');R(-2,hh,4,6+Math.random()*6,'#ffe14d')}
 R(-hw-1,-hh+6,4,9,'#111');R(hw-3,-hh+6,4,9,'#111');R(-hw-1,hh-15,4,9,'#111');R(hw-3,hh-15,4,9,'#111');
 R(-hw+2,-hh,w-4,h,c.b);R(-hw+2,-hh,3,h,c.d);R(hw-5,-hh,3,h,c.d);R(-hw+4,-hh+2,w-8,4,c.d);
 if(o.s)R(-2,-hh+2,4,h-4,c.d);
 R(-hw+4,-hh+13,w-8,8,'#9fe8ff');R(-hw+4,-hh+13,w-8,2,'#fff');R(-hw+5,hh-16,w-10,5,'#6fb8d0');
 R(-hw+3,-hh,4,2,'#ffe');R(hw-7,-hh,4,2,'#ffe');R(-hw+3,hh-2,4,2,'#f22');R(hw-7,hh-2,4,2,'#f22');
 cx.restore()}
function oil(x,y){x=Math.round(x);y=Math.round(y);R(x-14,y-15,28,30,'#101018');R(x-22,y-8,44,16,'#101018');R(x-18,y-12,36,24,'#101018');R(x-9,y-5,10,3,'#3b3b6a');R(x+3,y+3,7,2,'#3b3b6a')}
function draw(){
 cx.setTransform(1,0,0,1,0,0);cx.fillStyle='#0b0b14';cx.fillRect(0,0,cv.width,cv.height);
 const sx=shake>0?(Math.random()-.5)*8*shake:0,sy=shake>0?(Math.random()-.5)*8*shake:0;
 cx.setTransform(DPR*S,0,0,DPR*S,DPR*S*OX+sx*DPR,sy*DPR);
 cx.save();cx.beginPath();cx.rect(0,0,GW,GH);cx.clip();
 for(let i=0;i<GH/40+3;i++)R(0,(off%80)+i*40-80,GW,40,i%2?'#1f7a2a':'#2a8f35');
 for(let j=0;j<GH/110+3;j++){const id=Math.floor(off/110)-j,y=(off%110)+j*110-110;
  if(hs(id+3)>.2){const x=4+hs(id)*14;R(x+5,y+12,4,8,'#6b4423');R(x,y,14,14,'#0f5a1c');R(x+2,y+2,10,10,'#1d8a2e');R(x+4,y+3,3,3,'#46b85a')}
  if(hs(id+11)>.2){const x=RL+RW+8+hs(id+7)*14;R(x+5,y+12,4,8,'#6b4423');R(x,y,14,14,'#0f5a1c');R(x+2,y+2,10,10,'#1d8a2e');R(x+4,y+3,3,3,'#46b85a')}}
 R(RL,0,RW,GH,'#3c3c46');
 for(let i=0;i<GH/24+3;i++){const y=(off%48)+i*24-48,c=i%2?'#eee':'#e03030';R(RL,y,10,24,c);R(RL+RW-10,y,10,24,c)}
 R(RL+10,0,2,GH,'#ddd');R(RL+RW-12,0,2,GH,'#ddd');
 for(let k=1;k<4;k++)for(let i=0;i<GH/60+3;i++)R(RL+LW*k-2,(off%60)+i*60-60,4,30,'#d8d8d8');
 const cy=carY(),fy=cy-(TRACK-dist)*10;
 if(fy>-40&&fy<GH+40){for(let r=0;r<2;r++)for(let c=0;c<(RW-24)/12;c++)R(RL+12+c*12,fy-12+r*12,12,12,(c+r)%2?'#fff':'#111');
  R(RL+10,fy-18,2,18,'#ccc');R(RL+RW-12,fy-18,2,18,'#ccc');R(RL+10,fy-20,RW-20,6,'#ffd21f');T('FINISH',GW/2,fy-24,'#ffd21f','center',12)}
 for(const c of cars)if(c.t==='oil')oil(c.x,c.y);
 for(const c of cars){if(c.t==='fuel'){car(c.x,c.y,PAL.fuel,{h:50});T('F',c.x,c.y+5,'#fff','center',14)}else if(c.t!=='oil')car(c.x,c.y,PAL[c.t])}
 if(!(P.inv>0&&!P.spin&&Math.floor(tm*12)%2))car(P.x,cy,PAL.p,{a:P.ang,s:1,f:P.nit&&state==='play'});
 for(const p of parts){cx.globalAlpha=Math.min(1,p.l*2);R(Math.round(p.x),Math.round(p.y),p.s,p.s,p.c)}cx.globalAlpha=1;
 for(const p of pops)T(p.s,p.x,p.y,'#7cf','center',13);
 // HUD
 R(0,0,GW,38,'rgba(0,0,0,.6)');
 T('SCORE '+String(score()).padStart(6,'0'),8,16,'#fff','left',13);T(Math.round(speed*.4)+' km/h',GW-8,16,P.nit?'#ff9a4d':'#fff','right',13);
 T('HI '+String(Math.max(HS,state==='play'?0:HS)).padStart(6,'0'),8,32,'#ffd21f','left',11);T(Math.floor(dist)+'/'+TRACK+' m',GW-8,32,'#7cf','right',11);
 const by=52,bh=GH-195;
 R(6,by-2,16,bh+4,'rgba(0,0,0,.55)');R(GW-22,by-2,16,bh+4,'rgba(0,0,0,.55)');
 T('FUEL',14,by-5,'#fff','center',9);T('GOAL',GW-14,by-5,'#ffd21f','center',9);
 const fc=fuel>50?'#3ddc5a':fuel>25?'#ffd21f':(Math.floor(tm*6)%2?'#ff3030':'#a01010');
 R(9,by+bh*(1-fuel/100),10,bh*fuel/100,fc);
 R(GW-19,by,10,bh,'#222');for(let i=0;i<bh/8;i++)if(i%2)R(GW-19,by+i*8,10,4,'#444');
 R(GW-19,by,10,4,'#fff');R(GW-19,by+4,10,4,'#111');
 const my=by+bh-Math.min(1,dist/TRACK)*bh;R(GW-21,my-4,14,8,'#ff6a00');R(GW-17,my-2,6,4,'#fff');
 if(fuel<25&&state==='play'&&Math.floor(tm*4)%2)T('LOW FUEL!',GW/2,70,'#ff4040','center',16);
 cx.restore()}

/* ---------- loop ---------- */
let last=0;
function frame(t){requestAnimationFrame(frame);const dt=Math.min(.05,(t-last)/1000||0);last=t;tm=t/1000;
 if(state==='play')update(dt);else if(state==='start')off+=100*dt;
 tick(dt);draw();
 if(AC){const n=AC.currentTime;eng.frequency.setTargetAtTime(38+speed*.26+(P.nit?30:0),n,.05);engG.gain.setTargetAtTime(state==='play'?.045:0,n,.1)}}
requestAnimationFrame(frame);
})();
</script></body></html>
